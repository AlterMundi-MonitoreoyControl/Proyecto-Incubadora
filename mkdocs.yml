site_name: LibreIncu-150
site_description: Manual de fabricación y montaje - LibreIncu 150 v3
site_url: https://pablomonte.github.io/LibreIncu-150/
docs_dir: docs

theme:
  name: material
  language: es
  icon:
    logo: material/egg
  palette:
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.top
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.suggest

nav:
  - Inicio: index.md
  - Antes de fabricar: antes-de-fabricar.md
  - Compra y corte: compra-y-corte.md
  - Inventario: inventario.md
  - Montaje mecánico: montaje-mecanico.md
  - Instalación eléctrica: instalacion-electrica.md
  - Puesta en marcha: puesta-en-marcha.md
  - Solución de problemas: troubleshooting.md
  - Vista 3D: vista-3d.md
  - Anexos: anexos.md
  - Descargar PDF: manual_libreincu_150.pdf

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.tasklist
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search
